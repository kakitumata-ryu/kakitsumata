<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墓場 | カキツ、また</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <a class="logo" href="index.html">カキツ、また / 如く二次創作</a>
</header>
<main>
<section class="section">
  <div class="section-title"><span>墓場</span><h2>墓場</h2></div>
  <p class="hint">現在の作品一覧から外した作品です。</p>
  <div class="works" id="graveyard-list"></div>
</section>
</main>
<script src="data.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const rows = (window.records || [])
  .filter(w => w.grave)
  .sort((a,b)=>String(a.reading||a.title).localeCompare(String(b.reading||b.title),"ja"));
const list = document.querySelector("#graveyard-list");

async function openGrave(id){
  const n = String(id).padStart(3,"0");
  const candidates = [`works/${n}.html`, `${n}.html`];
  for (const url of candidates) {
    try {
      const r = await fetch(url, {cache:"no-cache"});
      if (!r.ok) continue;
      const html = await r.text();
      // 旧プレースホルダーしかない場合は、別の配置にある本文ページを探す。
      if (/本文ファイルはまだ登録されていません/.test(html)) continue;
      location.href = url;
      return;
    } catch(e) {}
  }
  // 最後は標準位置へ遷移して、GitHub Pages側の既存ページをそのまま使う。
  location.href = `works/${n}.html`;
}

list.innerHTML = rows.map(w => {
  const onclick = `openGrave('${String(w.id).replace(/'/g,"\\'")}'); return false;`;
  return `<a href="works/${String(w.id).padStart(3,"0")}.html" class="work" onclick="${onclick}">
    <span class="meta">${esc(w.couple)}</span>
    <strong>${esc(w.title)}</strong>
    <em>${esc(w.description || "")}</em>
  </a>`;
}).join("") || '<p class="filter-empty">墓場に作品はありません。</p>';
</script>
<script src="transition.js"></script>
</body>
</html>
