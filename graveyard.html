<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墓場 / カキツまた</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <a href="index.html" class="brand">カキツまた <span>/ 如く二次創作</span></a>
</header>
<main class="page">
  <h1>墓場</h1>
  <p class="hint">現在の作品一覧から外した作品を置いています。</p>
  <div id="graveyard-list" class="works-grid"></div>
</main>
<script src="data.js"></script>
<script>
const list = document.getElementById("graveyard-list");
const items = records.filter(r => r.grave);
if (!items.length) {
  list.innerHTML = '<p class="empty">墓場に作品はありません。</p>';
} else {
  items.sort((a,b) => (a.reading||a.title).localeCompare(b.reading||b.title, "ja"));
  list.innerHTML = items.map(r => {
    const href = r.adult ? 'adult-warning.html?id=' + encodeURIComponent(r.id) : (r._href || '#');
    return '<article class="work-card">' +
      '<div class="work-meta">' + (r.couple || '') + '</div>' +
      '<h2><a href="' + href + '">' + r.title + '</a></h2>' +
      (r.description ? '<p>' + r.description + '</p>' : '') +
      '</article>';
  }).join("");
}
</script>
</body>
</html>
