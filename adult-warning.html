<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成人向け作品 | カキツ、また</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <a class="logo" href="index.html">カキツ、また / 如く二次創作</a>
</header>
<main>
<section class="section adult-gate">
  <div class="section-title"><span>確認</span><h2>成人向け作品</h2></div>
  <p>この先は成人向けの内容を含む作品です。</p>
  <p>18歳未満の方は閲覧しないでください。</p>
  <div class="adult-gate-actions">
    <button id="enter" type="button">成人です。作品を見る</button>
    <a href="index.html">ホームに戻る</a>
  </div>
</section>
</main>
<script>
const id = new URLSearchParams(location.search).get("id");
const adultIds = ["022", "025", "026", "028", "029", "036", "041", "043", "044", "046", "050"];
const target = adultIds.includes(String(id).padStart(3,"0"))
  ? "works/adult/" + String(id).padStart(3,"0") + ".html"
  : "adult.html";
document.querySelector("#enter").addEventListener("click", () => location.href = target);
</script>
<script src="transition.js"></script>
</body>
</html>
